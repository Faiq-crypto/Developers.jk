<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base USDC Miner</title>
    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0b0f;
            --card: #13161f;
            --primary: #0052ff; /* Base Blue */
            --primary-hover: #0042cc;
            --text: #ffffff;
            --text-gray: #8a919e;
            --border: #2a2f3e;
        }

        body {
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .container { max-width: 480px; width: 100%; }

        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        
        .btn-connect {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600;
            transition: 0.2s;
        }
        .btn-connect:hover { background: rgba(255,255,255,0.2); }

        /* --- Stats Card --- */
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .stat-label { color: var(--text-gray); font-size: 0.9rem; }
        .stat-val { font-weight: 700; font-size: 1.1rem; font-family: monospace; }
        .highlight { color: var(--primary); }

        .big-display { text-align: center; margin: 30px 0; }
        .big-display h2 { font-size: 2.5rem; margin: 0; color: white; }
        .big-display p { color: var(--text-gray); margin: 5px 0 0 0; }

        /* --- Action Buttons --- */
        .btn-main {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 800; font-size: 1rem;
            cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-main:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

        /* --- Toast --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center;
            border-radius: 8px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px;
            transform: translateX(-50%); border: 1px solid var(--primary);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* Loader */
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">⚡ Base<span>Miner</span></div>
        <button id="connectBtn" class="btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <!-- Stats Dashboard -->
    <div class="card">
        <div class="stat-row">
            <span class="stat-label">Daily Yield</span>
            <span class="stat-val highlight" id="dailyRateDisplay">Loading...</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Wallet Balance</span>
            <span class="stat-val" id="userBalance">0.00 USDC</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Mining Status</span>
            <span class="stat-val" id="statusBadge">Inactive</span>
        </div>

        <div class="big-display">
            <h2 id="pendingRewards">0.0000</h2>
            <p>Pending USDC Rewards</p>
        </div>

        <button id="actionBtn" class="btn-main" onclick="handleAction()">Connect Wallet First</button>
        <p id="timer" style="text-align:center; color:var(--text-gray); font-size:0.8rem; margin-top:10px;"></p>
    </div>

    <div style="text-align:center; color:#444; font-size:0.8rem;">
        Powered by Base Network
    </div>
</div>

<div id="toast">Alert Message</div>

<script>
    // ==========================================
    // ⚠️ PASTE YOUR CONTRACT ADDRESS HERE
    const CONTRACT_ADDRESS = "YOUR_CONTRACT_ADDRESS_HERE"; 
    // ==========================================

    const USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"; // Base Mainnet USDC

    // Minimal ABIs
    const MINER_ABI = [
        "function startMining() external",
        "function claimRewards() external",
        "function getPendingRewards(address) view returns (uint256)",
        "function dailyRatePercent() view returns (uint256)",
        "function miners(address) view returns (uint40, uint40, bool)",
        "function claimInterval() view returns (uint256)"
    ];
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function allowance(address, address) view returns (uint256)",
        "function approve(address, uint256) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, minerContract, usdcContract;
    let userAddress;
    let isMining = false;
    let claimIntervalSeconds = 900; // Default 15 mins
    let lastClaimTime = 0;

    async function connectWallet() {
        if (!window.ethereum) return showToast("Please install MetaMask or Coinbase Wallet");
        
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            minerContract = new ethers.Contract(CONTRACT_ADDRESS, MINER_ABI, signer);
            usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);

            document.getElementById("connectBtn").innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            // Initial Fetch
            await fetchConfig();
            await refreshData();
            
            // Start Auto-Refresh Loop (every 5 seconds)
            setInterval(refreshData, 5000);

        } catch (err) {
            console.error(err);
            showToast("Connection Failed");
        }
    }

    // Fetch static config (Rate, Interval)
    async function fetchConfig() {
        try {
            const [rate, interval] = await Promise.all([
                minerContract.dailyRatePercent(),
                minerContract.claimInterval()
            ]);
            document.getElementById("dailyRateDisplay").innerText = rate + "% / Day";
            claimIntervalSeconds = Number(interval);
        } catch (e) { console.log("Error fetching config", e); }
    }

    // Refresh dynamic data
    async function refreshData() {
        if (!userAddress) return;

        try {
            // 1. Get Balance & Allowance
            const [balance, allowance, minerInfo] = await Promise.all([
                usdcContract.balanceOf(userAddress),
                usdcContract.allowance(userAddress, CONTRACT_ADDRESS),
                minerContract.miners(userAddress)
            ]);

            document.getElementById("userBalance").innerText = ethers.formatUnits(balance, 6) + " USDC";
            
            // 2. Determine State
            const allowanceVal = ethers.formatUnits(allowance, 6);
            isMining = minerInfo[2]; // bool isMining
            lastClaimTime = Number(minerInfo[1]);

            const btn = document.getElementById("actionBtn");
            const status = document.getElementById("statusBadge");

            if (parseFloat(allowanceVal) < 1) {
                // Needs Approval
                status.innerText = "Not Started";
                status.className = "stat-val";
                status.style.color = "#888";
                btn.innerText = "Enable USDC Mining";
                btn.onclick = approveToken;
                btn.disabled = false;
            } else if (!isMining) {
                // Approved but needs to call startMining()
                status.innerText = "Ready";
                btn.innerText = "Start Mining Now";
                btn.onclick = startMiningTx;
                btn.disabled = false;
            } else {
                // Mining Active
                status.innerText = "Active 🟢";
                status.style.color = "#00c853";
                
                // Rewards
                const pending = await minerContract.getPendingRewards(userAddress);
                document.getElementById("pendingRewards").innerText = ethers.formatUnits(pending, 6);

                // Timer Logic for Button
                const now = Math.floor(Date.now() / 1000);
                const nextClaim = lastClaimTime + claimIntervalSeconds;
                
                if (now >= nextClaim) {
                    btn.innerText = "Claim Rewards";
                    btn.disabled = false;
                    btn.onclick = claimRewards;
                    document.getElementById("timer").innerText = "Rewards available now";
                } else {
                    btn.innerText = "Mining in progress...";
                    btn.disabled = true;
                    const wait = nextClaim - now;
                    document.getElementById("timer").innerText = `Next claim in: ${Math.floor(wait/60)}m ${wait%60}s`;
                }
            }

        } catch (e) { console.error(e); }
    }

    // --- Actions ---

    async function approveToken() {
        try {
            const btn = document.getElementById("actionBtn");
            btn.innerText = "Approving...";
            btn.disabled = true;

            // Approve Max
            const max = ethers.MaxUint256;
            const tx = await usdcContract.approve(CONTRACT_ADDRESS, max);
            showToast("⏳ Transaction Sent...");
            await tx.wait();
            showToast("✅ Approved! Now Start Mining.");
            
            // Immediately refresh
            refreshData();
        } catch (e) {
            showToast("Approval Failed");
            document.getElementById("actionBtn").disabled = false;
        }
    }

    async function startMiningTx() {
        try {
            const tx = await minerContract.startMining();
            showToast("⏳ Starting Engine...");
            await tx.wait();
            showToast("✅ Mining Started!");
            refreshData();
        } catch (e) { showToast("Error Starting"); }
    }

    async function claimRewards() {
        try {
            const tx = await minerContract.claimRewards();
            showToast("⏳ Claiming...");
            await tx.wait();
            showToast("✅ Rewards Sent to Wallet!");
            refreshData();
        } catch (e) {
            // Check for our custom error "SystemUpgradeTryLater"
            if (e.message.includes("SystemUpgrade") || e.message.includes("execution reverted")) {
                showToast("⚠️ Maintenance Mode: Try again later");
            } else {
                showToast("Claim Failed");
            }
        }
    }

    // Helper
    function showToast(msg) {
        const x = document.getElementById("toast");
        x.innerText = msg;
        x.className = "show";
        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    // Auto connect if previously connected
    if(window.ethereum && window.ethereum.selectedAddress) {
        // connectWallet(); // Optional: Auto connect on load
    }
</script>
</body>
</html>
