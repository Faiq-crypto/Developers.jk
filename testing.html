<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base USDC Miner | Pro</title>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05060a;
            --card-bg: rgba(20, 25, 35, 0.85);
            --primary: #0052ff;
            --primary-glow: rgba(0, 82, 255, 0.4);
            --primary-hover: #0042cc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00d26a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, var(--primary-glow) 0%, transparent 60%),
                radial-gradient(circle at 100% 50%, rgba(0, 82, 255, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 460px; width: 100%; position: relative; z-index: 2; }

        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        
        .btn-connect {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: white; padding: 10px 18px; border-radius: 30px;
            font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .btn-connect:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

        /* --- Card --- */
        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); backdrop-filter: blur(20px);
            margin-bottom: 20px;
        }

        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .stat-row:last-of-type { border: none; padding-bottom: 0; margin-bottom: 10px; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .stat-val { font-weight: 700; font-size: 1.05rem; }
        .highlight { color: var(--primary); text-shadow: 0 0 10px rgba(0,82,255,0.3); }

        /* --- Big Display --- */
        .big-display {
            text-align: center; margin: 30px 0; background: rgba(0,0,0,0.3);
            border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05);
        }
        .big-display h2 {
            font-size: 2.5rem; margin: 0;
            background: linear-gradient(180deg, #fff, #a5b4fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .big-display p { color: var(--text-muted); margin: 8px 0 0 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Main Button --- */
        .btn-main {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: var(--primary); color: white;
            font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 82, 255, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #2a2f3e; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- Badges --- */
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .badge-gray { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .badge-green { background: rgba(0, 210, 106, 0.15); color: var(--success); box-shadow: 0 0 10px rgba(0, 210, 106, 0.1); }

        /* --- Toast --- */
        #toast {
            visibility: hidden; min-width: 250px; background: rgba(20, 25, 35, 0.95);
            color: #fff; text-align: center; border-radius: 12px; padding: 16px;
            position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%);
            border: 1px solid var(--border); opacity: 0; transition: 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        
        /* Spinner */
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">⚡ Base<span>Miner</span></div>
        <button id="connectBtn" class="btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div class="card">
        <!-- Daily Yield (Loads Immediately) -->
        <div class="stat-row">
            <span class="stat-label">Daily Yield</span>
            <span class="stat-val highlight" id="dailyRateDisplay">Loading...</span>
        </div>
        
        <!-- Wallet Data (Loads after connect) -->
        <div class="stat-row">
            <span class="stat-label">Wallet Balance</span>
            <span class="stat-val" id="userBalance">---</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">System Status</span>
            <span id="statusBadge" class="badge badge-gray">Disconnect</span>
        </div>

        <div class="big-display">
            <h2 id="pendingRewards">0.0000</h2>
            <p>Pending USDC Rewards</p>
        </div>

        <!-- Single Action Button -->
        <button id="actionBtn" class="btn-main" onclick="connectWallet()">
            Connect Wallet
        </button>
        
        <p id="timer" style="text-align:center; color:var(--text-muted); font-size:0.8rem; margin-top:15px; min-height:1.2em;">
            Connect to Base Network to start
        </p>
    </div>
    
    <div style="text-align:center; font-size:0.8rem; color:#444; margin-top:10px;">
        Running on Base Mainnet
    </div>
</div>

<div id="toast">Message</div>

<script>
    // ================= CONFIGURATION =================
    const CONTRACT_ADDRESS = "0x7496D84c2049d0be73D3B5B76798CAEc87839626"; 
    const USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"; 
    const BASE_RPC_URL = "https://mainnet.base.org"; // Public RPC for reading data
    const BASE_CHAIN_ID = 8453n;
    const BASE_CHAIN_HEX = "0x2105";
    // =================================================

    const MINER_ABI = [
        "function startMining() external",
        "function claimRewards() external",
        "function getPendingRewards(address) view returns (uint256)",
        "function dailyRatePercent() view returns (uint256)",
        "function miners(address) view returns (uint40, uint40, bool)",
        "function claimInterval() view returns (uint256)"
    ];
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function allowance(address, address) view returns (uint256)",
        "function approve(address, uint256) returns (bool)"
    ];

    // Global State
    let provider, signer, minerContract, usdcContract;
    let userAddress = null;
    let isConnected = false;
    let refreshInterval;
    
    // Config Data
    let dailyRate = 0;
    let claimInterval = 900;

    // --- 1. INITIALIZATION (Runs immediately) ---
    window.addEventListener('load', async () => {
        // Init Read-Only Provider to fetch yields BEFORE wallet connection
        try {
            const readOnlyProvider = new ethers.JsonRpcProvider(BASE_RPC_URL);
            const readOnlyContract = new ethers.Contract(CONTRACT_ADDRESS, MINER_ABI, readOnlyProvider);
            
            const [rate, interval] = await Promise.all([
                readOnlyContract.dailyRatePercent(),
                readOnlyContract.claimInterval()
            ]);
            
            dailyRate = rate;
            claimInterval = Number(interval);
            document.getElementById("dailyRateDisplay").innerText = rate + "% / Day";
        } catch (e) {
            console.error("Read-only fetch failed", e);
            document.getElementById("dailyRateDisplay").innerText = "4% / Day"; // Fallback
        }

        // Check if already connected (Auto-Connect)
        if (window.ethereum && window.ethereum.selectedAddress) {
            connectWallet();
        }
    });

    // --- 2. CONNECT WALLET LOGIC ---
    async function connectWallet() {
        if (!window.ethereum) return showToast("⚠️ Wallet not found!");

        const topBtn = document.getElementById("connectBtn");
        const actionBtn = document.getElementById("actionBtn");

        try {
            // Update UI to loading
            topBtn.innerHTML = `<div class="spinner"></div>`;
            actionBtn.innerHTML = `<div class="spinner"></div> Connecting...`;

            // A. Request Accounts
            await window.ethereum.request({ method: 'eth_requestAccounts' });

            // B. Setup Provider
            provider = new ethers.BrowserProvider(window.ethereum);

            // C. Switch Network (Force Base)
            const network = await provider.getNetwork();
            if (network.chainId !== BASE_CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BASE_CHAIN_HEX }],
                    });
                    // Re-init provider after switch
                    provider = new ethers.BrowserProvider(window.ethereum);
                } catch (switchError) {
                    // Error 4902: Chain not added
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: BASE_CHAIN_HEX,
                                chainName: 'Base Mainnet',
                                rpcUrls: ['https://mainnet.base.org'],
                                nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
                                blockExplorerUrls: ['https://basescan.org']
                            }],
                        });
                        provider = new ethers.BrowserProvider(window.ethereum);
                    } else {
                        throw new Error("Network switch rejected");
                    }
                }
            }

            // D. Setup Signer & Contracts
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            minerContract = new ethers.Contract(CONTRACT_ADDRESS, MINER_ABI, signer);
            usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);

            isConnected = true;
            
            // E. Update UI immediately
            topBtn.innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            topBtn.style.borderColor = "#00d26a";
            topBtn.onclick = null; // Disable click on top button once connected

            showToast("✅ Connected successfully!");
            
            // F. Start Data Loop
            updateDashboard();
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(updateDashboard, 5000);

        } catch (error) {
            console.error(error);
            showToast("❌ Connection Failed");
            // Reset Buttons
            topBtn.innerText = "Connect Wallet";
            actionBtn.innerText = "Connect Wallet";
            actionBtn.onclick = connectWallet;
        }
    }

    // --- 3. CORE DASHBOARD LOGIC (Handles Button States) ---
    async function updateDashboard() {
        if (!isConnected || !userAddress) return;

        try {
            // Fetch User Data
            const [balance, allowance, minerInfo, pending] = await Promise.all([
                usdcContract.balanceOf(userAddress),
                usdcContract.allowance(userAddress, CONTRACT_ADDRESS),
                minerContract.miners(userAddress),
                minerContract.getPendingRewards(userAddress)
            ]);

            // Formatting
            const fmtBalance = parseFloat(ethers.formatUnits(balance, 6));
            const fmtAllowance = parseFloat(ethers.formatUnits(allowance, 6));
            const fmtPending = parseFloat(ethers.formatUnits(pending, 6));
            
            // Update Text Displays
            document.getElementById("userBalance").innerText = fmtBalance.toFixed(2) + " USDC";
            document.getElementById("pendingRewards").innerText = fmtPending.toFixed(5);
            
            const isMining = minerInfo[2];
            const lastClaim = Number(minerInfo[1]);

            // --- SMART BUTTON LOGIC ---
            const btn = document.getElementById("actionBtn");
            const status = document.getElementById("statusBadge");
            const timer = document.getElementById("timer");

            // STATE 1: Needs Approval
            if (fmtAllowance < 10) {
                status.innerText = "Action Needed";
                status.className = "badge badge-gray";
                
                btn.innerText = "Enable USDC Mining";
                btn.onclick = approveUSDC;
                btn.disabled = false;
                timer.innerText = "Step 1: Approve USDC to start";
                return;
            }

            // STATE 2: Approved, Needs Start
            if (!isMining) {
                status.innerText = "Ready";
                status.className = "badge badge-gray";
                
                btn.innerText = "Start Mining Now";
                btn.onclick = startMining;
                btn.disabled = false;
                timer.innerText = "Step 2: Activate the miner";
                return;
            }

            // STATE 3: Mining Active (Check Timer)
            status.innerText = "Active 🟢";
            status.className = "badge badge-green";

            const now = Math.floor(Date.now() / 1000);
            const nextClaimTime = lastClaim + claimInterval;
            
            if (now >= nextClaimTime) {
                // Claim Available
                btn.innerHTML = "Claim Rewards 💰";
                btn.onclick = claimRewards;
                btn.disabled = false;
                timer.innerText = "✨ Rewards are ready to collect!";
                timer.style.color = "#00d26a";
            } else {
                // Countdown
                btn.innerText = "Mining in Progress...";
                btn.onclick = null;
                btn.disabled = true;
                
                const timeLeft = nextClaimTime - now;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timer.innerText = `Next claim in: ${m}m ${s}s`;
                timer.style.color = "#94a3b8";
            }

        } catch (e) {
            console.error("Data refresh error", e);
        }
    }

    // --- 4. ACTIONS ---

    async function approveUSDC() {
        const btn = document.getElementById("actionBtn");
        try {
            btn.innerHTML = `<div class="spinner"></div> Approving...`;
            btn.disabled = true;
            
            const max = ethers.MaxUint256;
            const tx = await usdcContract.approve(CONTRACT_ADDRESS, max);
            showToast("⏳ Transaction sent...");
            await tx.wait();
            showToast("✅ Approved!");
            updateDashboard();
        } catch (e) {
            console.error(e);
            showToast("❌ Approval Failed");
            updateDashboard(); // Reset button
        }
    }

    async function startMining() {
        const btn = document.getElementById("actionBtn");
        try {
            btn.innerHTML = `<div class="spinner"></div> Starting...`;
            btn.disabled = true;
            
            const tx = await minerContract.startMining();
            showToast("⏳ Starting Miner...");
            await tx.wait();
            showToast("✅ Mining Active!");
            updateDashboard();
        } catch (e) {
            console.error(e);
            showToast("❌ Failed to start");
            updateDashboard();
        }
    }

    async function claimRewards() {
        const btn = document.getElementById("actionBtn");
        try {
            btn.innerHTML = `<div class="spinner"></div> Claiming...`;
            btn.disabled = true;
            
            const tx = await minerContract.claimRewards();
            showToast("⏳ Claiming...");
            await tx.wait();
            showToast("✅ Rewards Claimed!");
            updateDashboard();
        } catch (e) {
            console.error(e);
            showToast("❌ Claim Failed");
            updateDashboard();
        }
    }

    // --- UTILS ---
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }
    
    // Auto-reload on chain change
    if (window.ethereum) {
        window.ethereum.on('chainChanged', () => window.location.reload());
        window.ethereum.on('accountsChanged', () => window.location.reload());
    }
</script>
</body>
</html>
